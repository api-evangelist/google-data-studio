aid: google-data-studio
name: Google Data Studio
description: >-
  Google Data Studio, now rebranded as Looker Studio, is a free data visualization and business intelligence tool from
  Google that transforms data into customizable, shareable dashboards and reports. It connects to a wide range of data
  sources and supports community connectors and visualizations for extensibility.
