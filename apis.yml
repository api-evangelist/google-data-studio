- name: Looker Studio Community Connectors
  description: >-
    Community Connectors enable direct connections from Looker Studio to any internet-accessible data
    source using Google Apps Script. Developers implement getAuthType, getConfig, getSchema, and getData
    functions to build custom connectors.
  image: https://www.gstatic.com/analytics-suite/header/suite/v2/ic_data_studio.svg
